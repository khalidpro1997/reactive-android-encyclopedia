/* ---------- pure stream operators (events are recomputed from the log) ---------- */
const sorted = (evs) => [...evs].sort((p, q) => p.t - q.t || p.seq - q.seq);
const lastVal = (evs, track, now) => {
  const xs = sorted(evs.filter((e) => e.track === track && e.t <= now));
  return xs.length ? xs[xs.length - 1].v : undefined;
};

// combine / transform: re-run whenever EITHER side emits, using the latest of the other
const pairLatest = (f) => (evs) => {
  let la = null, lb = null;
  const out = [], lines = [];
  sorted(evs).forEach((e) => {
    if (e.track === 'a') la = e; else lb = e;
    if (la && lb) {
      const other = e.track === 'a' ? lb : la;
      out.push({ id: 'o' + e.id, t: e.t, v: f(la.v, lb.v) });
      lines.push({ from: { t: other.t, r: other.track }, to: { t: e.t, r: 'out' } });
    }
  });
  return { out, lines };
};

// zip: 1st with 1st, 2nd with 2nd (waits for both)
const zipOp = (evs) => {
  const qa = [], qb = [], out = [], lines = [];
  sorted(evs).forEach((e) => {
    (e.track === 'a' ? qa : qb).push(e);
    while (qa.length && qb.length) {
      const x = qa.shift(), y = qb.shift();
      out.push({ id: 'z' + x.id + y.id, t: e.t, v: `${x.v}|${y.v}` });
      lines.push({ from: { t: x.t, r: 'a' }, to: { t: e.t, r: 'out' } });
      lines.push({ from: { t: y.t, r: 'b' }, to: { t: e.t, r: 'out' } });
    }
  });
  return { out, lines };
};

/* ---------- StateFlow vs SharedFlow model ---------- */
function flowsCompute(evs, now) {
  const S = sorted(evs);
  const em = S.filter((e) => e.track === 'a');

  // subscription sessions: the Activity collector (stops/starts) + late listeners
  const sessions = [{ id: 'act0', name: 'Activity collector', t0: 0, t1: Infinity }];
  let cur = sessions[0];
  S.filter((e) => e.track === 'stop' || e.track === 'start').forEach((e) => {
    if (e.track === 'stop' && cur) { cur.t1 = e.t; cur = null; }
    else if (e.track === 'start' && !cur) {
      cur = { id: 'act' + e.id, name: 'Activity (restarted)', t0: e.t, t1: Infinity };
      sessions.push(cur);
    }
  });
  S.filter((e) => e.track === 'sub').forEach((e, i) =>
    sessions.push({ id: 'late' + e.id, name: `Late listener #${i + 1}`, t0: e.t, t1: Infinity }));
  const visible = sessions.filter((s) => s.t0 <= now);
  const anyActive = (t) => sessions.some((s) => s.t0 <= t && t < s.t1);

  const lifecycle = {
    label: 'lifecycle', color: '#94a3b8',
    items: S.filter((e) => ['stop', 'start', 'sub'].includes(e.track))
      .map((e) => ({ id: 'l' + e.id, t: e.t, v: e.track === 'stop' ? 'onStop' : e.track === 'start' ? 'onStart' : 'collect' })),
  };

  // StateFlow: distinct state; the current value is replayed to every new collector
  let last; const passes = []; const sfSt = {};
  em.forEach((e) => {
    if (e.v === last) sfSt[e.id] = 'ignored';
    else { last = e.v; passes.push(e); }
  });
  const stateAt = (t) => { let v; passes.forEach((p) => { if (p.t <= t) v = p.v; }); return v; };

  const sfRows = [
    lifecycle,
    { label: 'emit()', color: OUT, items: em.map((e) => ({ id: 'e' + e.id, t: e.t, v: e.v, status: sfSt[e.id] })) },
  ];
  visible.forEach((s) => {
    const items = [];
    const rv = stateAt(s.t0);
    if (rv !== undefined) items.push({ id: 'r' + s.id, t: s.t0, v: rv, color: REPLAY });
    passes.forEach((p) => { if (p.t > s.t0 && p.t < s.t1) items.push({ id: 's' + s.id + p.id, t: p.t, v: p.v }); });
    sfRows.push({ label: s.name, color: GOOD, items });
  });

  // SharedFlow: no replay, every emission goes only to live collectors
  const shSt = {};
  em.forEach((e) => { if (!anyActive(e.t)) shSt[e.id] = 'lost'; });
  const shRows = [
    lifecycle,
    { label: 'emit()', color: OUT, items: em.map((e) => ({ id: 'e' + e.id, t: e.t, v: e.v, status: shSt[e.id] })) },
  ];
  visible.forEach((s) => {
    shRows.push({
      label: s.name, color: GOOD,
      items: em.filter((e) => e.t > s.t0 && e.t < s.t1).map((e) => ({ id: 's' + s.id + e.id, t: e.t, v: e.v })),
    });
  });
  return { sf: { rows: sfRows }, sh: { rows: shRows } };
}

/* ---------- Timeline rendering ---------- */
function buildRows(demo, events, res) {
  const rows = demo.tracks.map((tr) => ({
    label: tr.label, color: TC[tr.id],
    items: events.filter((e) => e.track === tr.id).map((e) => ({ id: e.id, t: e.t, v: e.v, status: res.st ? res.st[e.id] : undefined })),
  }));
  rows.push({ label: demo.outLabel, color: demo.outColor, items: res.out || [], bars: res.bars || [] });
  return rows;
}

function Marble({ it, color, left, top, now }) {
  const dim = it.status && it.status !== 'pass';
  const badge = { blocked: '✕', dropped: '✕', cancelled: '✕', ignored: '=', lost: '∅' }[it.status];
  const recent = now - it.t < 400;
  const strike = it.status === 'cancelled' || it.status === 'dropped';
  return (
    <div className={`marble absolute flex h-7 min-w-[32px] max-w-[96px] -translate-x-1/2 -translate-y-1/2 items-center justify-center truncate px-2.5 font-mono text-[11px] font-bold text-slate-950 ${it.shape === 'square' ? 'rounded-md' : 'rounded-full'} ${recent ? 'pulse' : ''}`}
      style={{
        left: `${left}%`, top, background: color,
        boxShadow: dim ? 'none' : `0 0 14px ${color}aa`,
        opacity: dim ? 0.28 : 1,
        filter: dim ? 'grayscale(1)' : undefined,
        textDecoration: strike ? 'line-through' : undefined,
        color: undefined,
      }}>
      {String(it.v)}
      {badge && (
        <span className="absolute -right-2 -top-2 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] text-white">{badge}</span>
      )}
    </div>
  );
}

function Bar({ b, now, xp, top }) {
  if (b.start > now) return null;
  const stop = b.cancelAt !== undefined ? b.cancelAt : b.end;
  const span = b.end - b.start;
  const progress = Math.max(0, Math.min(1, (Math.min(now, stop) - b.start) / span));
  const cancelled = b.cancelAt !== undefined && now >= b.cancelAt;
  const done = !cancelled && now >= b.end;
  const color = cancelled ? '#f87171' : done ? GOOD : b.color || OUT;
  return (
    <div className="absolute flex h-5 -translate-y-1/2 items-center overflow-hidden rounded-md border"
      style={{ left: `${xp(b.start)}%`, width: `${xp(b.end) - xp(b.start)}%`, top, borderColor: color + '99', background: '#1e293b' }}>
      <div className="stripes absolute inset-y-0 left-0" style={{ width: `${progress * 100}%`, background: color + '55' }} />
      <span className="relative z-10 truncate px-2 font-mono text-[10px] text-white" style={{ textDecoration: cancelled ? 'line-through' : undefined }}>
        {b.label}
      </span>
      {cancelled && <span className="absolute right-1 z-10 text-[10px] font-bold text-red-400">✕ cancelled</span>}
    </div>
  );
}

function Timeline({ rows, lines = [], now }) {
  const viewStart = Math.max(0, now - 6800);
  const xp = (t) => ((t - viewStart) / WINDOW_MS) * 100;
  const cy = (i) => i * ROW_H + ROW_H / 2;
  const rowIdx = (r) => (r === 'out' ? rows.length - 1 : r === 'a' ? 0 : 1);
  const inView = (t) => t >= viewStart && t <= now;
  return (
    <div className="rounded-xl border border-slate-800 bg-slate-950/70 p-3">
      <div className="flex">
        <div className="w-28 shrink-0 sm:w-40">
          {rows.map((r, i) => (
            <div key={i} style={{ height: ROW_H }} className="flex items-center gap-2 pr-2 font-mono text-[11px] text-slate-400">
              <span className="h-2 w-2 shrink-0 rounded-full" style={{ background: r.color }} />
              <span className="truncate">{r.label}</span>
            </div>
          ))}
        </div>
        <div className="relative min-w-0 flex-1 overflow-hidden" style={{ height: rows.length * ROW_H }}>
          {rows.map((_, i) => (
            <div key={i} className="absolute inset-x-0 border-t border-slate-700/70" style={{ top: cy(i) }} />
          ))}
          <svg className="pointer-events-none absolute inset-0 h-full w-full overflow-visible">
            {lines.filter((l) => inView(l.to.t) && l.from.t >= viewStart).map((l, k) => (
              <line key={k}
                x1={`${xp(l.from.t)}%`} y1={cy(rowIdx(l.from.r))}
                x2={`${xp(l.to.t)}%`} y2={cy(rowIdx(l.to.r))}
                stroke="#c4b5fd" strokeOpacity="0.6" strokeWidth="1.5" strokeDasharray="4 4" />
            ))}
          </svg>
          <div className="absolute inset-y-0 w-px bg-cyan-300/50" style={{ left: `${xp(now)}%` }} />
          {rows.flatMap((r, i) => (r.bars || []).map((b) => (
            <Bar key={i + '-' + b.id} b={b} now={now} xp={xp} top={cy(i)} />
          )))}
          {rows.flatMap((r, i) => (r.items || []).filter((it) => inView(it.t)).map((it) => (
            <Marble key={i + '-' + it.id} it={it} color={it.color || r.color} left={xp(it.t)} top={cy(i)} now={now} />
          )))}
        </div>
      </div>
    </div>
  );
}

function Legend() {
  return (
    <p className="text-[11px] leading-relaxed text-slate-500">
      <span className="text-slate-300">●</span> emission &nbsp;·&nbsp;
      <span className="text-red-400">✕</span> blocked / cancelled / dropped &nbsp;·&nbsp;
      <span className="text-slate-300">=</span> duplicate ignored &nbsp;·&nbsp;
      <span className="text-slate-300">∅</span> lost (no collector) &nbsp;·&nbsp;
      dashed lines = source → output &nbsp;·&nbsp; cyan line = now
    </p>
  );
}

/* ---------- AppState panel ---------- */
function AppStatePanel({ events, now }) {
  const p = lastVal(events, 'a', now);
  const q = lastVal(events, 'b', now);
  const total = p !== undefined && q !== undefined ? p * q : undefined;
  const Box = ({ label, value, color, k }) => (
    <div className="rounded-xl border border-slate-800 bg-slate-900/70 p-3">
      <div className="font-mono text-[11px] uppercase tracking-wider" style={{ color }}>{label}</div>
      <div key={String(k)} className="flash mt-1 inline-block rounded px-1 font-mono text-2xl font-bold text-white">
        {value === undefined ? '—' : String(value)}
      </div>
    </div>
  );
  return (
    <section className="grid gap-3 sm:grid-cols-3">
      <Box label="price" value={p} color={TC.a} k={p} />
      <Box label="qty" value={q} color={TC.b} k={q} />
      <Box label="total = price × qty" value={total} color={OUT} k={total} />
      <div className="sm:col-span-3 flex flex-wrap items-center gap-2 text-xs text-slate-400">
        <Icon name="check" size={14} className="text-emerald-400" />
        Auto-tracked dependencies:
        <span className="rounded-full bg-cyan-400/15 px-2 py-0.5 font-mono text-cyan-300">price</span>
        <span className="rounded-full bg-orange-400/15 px-2 py-0.5 font-mono text-orange-300">qty</span>
        — no addSource(), no removeSource(), no manual subscribe.
      </div>
    </section>
  );
}

/* ---------- Demo page ---------- */
function DemoView({ demo }) {
  const [now, setNow] = useState(0);
  const [playing, setPlaying] = useState(!demo.predict);
  const [predicted, setPredicted] = useState(!demo.predict);
  const [compareId, setCompareId] = useState('');
  useEffect(() => {
    const toggle = () => { if (predicted) setPlaying((p) => !p); };
    window.addEventListener('reactive-toggle', toggle);
    return () => window.removeEventListener('reactive-toggle', toggle);
  }, [predicted]);
  const [speed, setSpeed] = useState(1);
  const [manual, setManual] = useState([]);
  const [copied, setCopied] = useState(false);
  const seq = useRef(0);

  const scriptEv = useMemo(() => demo.script.map((e, i) => ({ ...e, id: 's' + i, seq: i })), [demo]);
  const events = useMemo(() => [...scriptEv, ...manual], [scriptEv, manual]);
  const res = demo.compute(events, now);

  // virtual clock: advances with requestAnimationFrame, scaled by speed
  useEffect(() => {
    if (!playing) return;
    let raf, last = null;
    const frame = (ts) => {
      if (last !== null) {
        const dt = Math.min(ts - last, 1000); // track wall-clock time; cap only huge gaps (tab hidden)
        setNow((n) => n + dt * speed);
      }
      last = ts;
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, [playing, speed]);

  // Pause once everything has scrolled out of view, so the final state stays on screen.
  const lastEventT = Math.max(0, ...scriptEv.map((e) => e.t), ...manual.map((e) => e.t));
  useEffect(() => {
    if (playing && now > lastEventT + WINDOW_MS - 1500) setPlaying(false);
  }, [now, playing, lastEventT]);

  // Adds events at the current virtual time. '#' = next integer, '=' = repeat last, add = last + add.
  const addEvents = (track, v, n = 1, gap = 0, add) => {
    setManual((prev) => {
      const pool = [...scriptEv, ...prev];
      const out = [...prev];
      for (let i = 0; i < n; i++) {
        const onTrack = sorted(pool.filter((e) => e.track === track));
        const last = onTrack.length ? onTrack[onTrack.length - 1] : null;
        let value = v;
        if (add !== undefined) value = (last ? last.v : 0) + add;
        else if (v === '#') value = onTrack.length + 1;
        else if (v === '=') { if (!last) continue; value = last.v; }
        seq.current += 1;
        const ev = { id: 'm' + seq.current, seq: 1000 + seq.current, t: now + i * gap, track, v: value };
        pool.push(ev);
        out.push(ev);
      }
      return out;
    });
  };

  const reset = () => { setNow(0); setManual([]); setPlaying(predicted); };

  const copy = async () => {
    try { await navigator.clipboard.writeText(demo.code); setCopied(true); }
    catch (e) { setCopied(false); }
    setTimeout(() => setCopied(false), 1400);
  };

  const btn = 'inline-flex items-center gap-1.5 rounded-lg border border-slate-700 bg-slate-800/70 px-3 py-1.5 text-sm text-slate-100 transition hover:border-purple-400 hover:bg-slate-800 active:scale-95';

  return (
    <div className="mx-auto max-w-5xl space-y-6">
      <header>
        <div className="font-mono text-[11px] uppercase tracking-widest text-purple-300">{demo.cat}</div>
        <h1 className="mt-1 font-mono text-2xl font-bold text-white sm:text-3xl">{demo.title}</h1>
        <p className="mt-1 text-slate-400">{demo.sub}</p>
        <div className="mt-4 grid gap-3 md:grid-cols-2">
          <div className="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-4">
            <div className="mb-1 text-[11px] font-semibold uppercase tracking-wider text-emerald-300">In plain words</div>
            <p className="text-sm leading-relaxed text-slate-200">{demo.simple}</p>
          </div>
          <div className="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
            <div className="mb-1 text-[11px] font-semibold uppercase tracking-wider text-purple-300">How it works</div>
            <p className="text-sm leading-relaxed text-slate-300">{demo.explain}</p>
          </div>
        </div>
      </header>

      {/* transport */}
      <section className="flex flex-wrap items-center gap-2">
        <button className={btn} onClick={() => setPlaying((p) => !p)}>
          <Icon name={playing ? 'pause' : 'play'} size={14} />{playing ? 'Pause' : 'Play'}
        </button>
        <div className="inline-flex overflow-hidden rounded-lg border border-slate-700">
          {[0.5, 1].map((s) => (
            <button key={s} onClick={() => setSpeed(s)}
              className={`px-3 py-1.5 text-sm font-mono transition ${speed === s ? 'bg-purple-500/30 text-white' : 'bg-slate-800/70 text-slate-400 hover:text-slate-100'}`}>
              {s}x
            </button>
          ))}
        </div>
        <button className={btn} onClick={reset}><Icon name="rotate" size={14} />Reset Track</button>
        <span className="ml-auto font-mono text-xs text-slate-500">t = {(now / 1000).toFixed(1)}s</span>
      </section>

      {demo.predict && !predicted && (
        <PredictCard key={demo.id} predict={demo.predict} onDone={() => { setPredicted(true); setPlaying(true); }} />
      )}

      {/* animation + Android screen */}
      <section className="flex flex-col gap-6 lg:flex-row lg:items-start">
        <div className="min-w-0 flex-1">
        {demo.kind === 'flows' ? (
          <div className="space-y-5">
            <div>
              <div className="mb-2 text-sm font-semibold text-slate-200">{demo.heads ? demo.heads[0] : <>StateFlow <span className="font-normal text-slate-500">— sticky state, replays to new collectors, ignores duplicates</span></>}</div>
              <Timeline rows={res.sf.rows} now={now} />
            </div>
            <div>
              <div className="mb-2 text-sm font-semibold text-slate-200">{demo.heads ? demo.heads[1] : <>SharedFlow <span className="font-normal text-slate-500">— one-shot events, replay = 0, nothing kept for nobody</span></>}</div>
              <Timeline rows={res.sh.rows} now={now} />
            </div>
            <Legend />
          </div>
        ) : (
          <div className="space-y-2">
            <Timeline rows={res.rows || buildRows(demo, events, res)} lines={res.lines || []} now={now} />
            <Legend />
          </div>
        )}
        </div>
        <PhoneScreen demo={demo} events={events} res={res} now={now} />
      </section>

      <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
        <div className="mb-3 flex flex-wrap items-center gap-2 text-xs font-semibold uppercase tracking-wider text-purple-300">
          Compare mode
          <select value={compareId} onChange={(e) => setCompareId(e.target.value)}
            className="rounded-md border border-slate-700 bg-slate-950 px-2 py-1 font-mono text-xs normal-case tracking-normal text-slate-100">
            <option value="">— none —</option>
            {DEMOS.filter((d) => d.id !== demo.id && !d.kind).map((d) => (
              <option key={d.id} value={d.id}>{d.title}</option>
            ))}
          </select>
          <span className="font-normal normal-case tracking-normal text-slate-500">same input, different operator</span>
        </div>
        {compareId && (() => {
          const other = DEMOS.find((d) => d.id === compareId);
          const r2 = other.compute(events, now);
          return (
            <div>
              <div className="mb-2 font-mono text-xs text-slate-400">{other.title}</div>
              <Timeline rows={buildRows(other, events, r2)} lines={r2.lines || []} now={now} />
            </div>
          );
        })()}
      </section>

      {demo.panel === 'appstate' && <AppStatePanel events={events} now={now} />}

      {/* hands-on triggers */}
      <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
        <div className="mb-3 text-xs font-semibold uppercase tracking-wider text-purple-300">Hands-on triggers</div>
        <div className="flex flex-wrap items-center gap-2">
          {(demo.buttons || []).map((b) => (
            <button key={b.label} className={btn} onClick={() => addEvents(b.track, b.v, b.n, b.gap, b.add)}>{b.label}</button>
          ))}
          {demo.textbox && (

/* ---------- Android screen bodies (one per screen type) ---------- */
function ScreenBody({ type, screen, inputs, list, history, counts, loading, accent }) {
  const card = (i) => (
    <div key={i.id} className="flex items-center justify-between rounded-lg bg-slate-800/70 px-3 py-1.5 text-xs text-slate-200">
      <span className="truncate font-mono">{String(i.v)}</span>
      <span className="text-[10px]" style={{ color: i.color || accent }}>●</span>
    </div>
  );
  const field = (label, value) => (
    <div key={label}>
      <div className="text-[10px] uppercase tracking-wider text-slate-500">{label}</div>
      <div className="mt-1 truncate rounded-lg border border-slate-700 bg-slate-950 px-3 py-1.5 font-mono text-sm text-white">
        {value === undefined ? '—' : String(value)}
      </div>
    </div>
  );
  const label = <div className="text-[10px] uppercase tracking-wider text-slate-500">{screen.listLabel}</div>;

  if (type === 'form') {
    const enabled = list.length > 0;
    return (
      <div className="space-y-3 p-4">
        {inputs.map((i) => field(i.label, i.value))}
        <div className="mt-2 rounded-lg py-2 text-center text-sm font-semibold transition"
          style={{ background: enabled ? accent : '#334155', color: enabled ? '#0f172a' : '#94a3b8' }}>
          {screen.cta || 'Continue'} · {enabled ? 'enabled' : 'disabled'}
        </div>
      </div>
    );
  }
  if (type === 'badge') {
    const total = list[0] ? String(list[0].v) : '0';
    return (
      <div className="space-y-3 p-4">
        <div className="flex items-center justify-between rounded-xl bg-slate-800/70 px-3 py-2">
          <span className="text-xs text-slate-300">Cart</span>
          <span className="relative text-lg">🛒
            <span className="absolute -right-3 -top-2 min-w-[18px] rounded-full bg-red-500 px-1 text-center text-[10px] font-bold text-white">{total}</span>
          </span>
        </div>
        {inputs.map((i) => field(i.label, i.value))}
        {label}
        <div className="space-y-2">{list.map(card)}</div>
      </div>
    );
  }
  if (type === 'search') {
    return (
      <div className="space-y-3 p-4">
        <div className="flex items-center gap-2 rounded-full border border-slate-700 bg-slate-950 px-3 py-2 text-sm font-mono text-white">
          <span>⌕</span><span className="truncate">{inputs[0] && inputs[0].value !== undefined ? String(inputs[0].value) : 'Search…'}</span>
        </div>
        {loading && <div className="text-[10px] text-cyan-300">Loading results…</div>}
        {label}
        <div className="space-y-2">{list.map(card)}{list.length === 0 && <div className="text-xs text-slate-600">type to search</div>}</div>
      </div>
    );
  }
  if (type === 'ticker') {
    const nums = history.map((i) => Number(i.v)).filter((n) => !Number.isNaN(n));
    const max = Math.max(1, ...nums);
    return (
      <div className="space-y-3 p-4">
        {label}
        <div className="font-mono text-4xl font-bold text-white">{list[0] ? String(list[0].v) : '—'}</div>
        <div className="flex h-20 items-end gap-1">
          {history.map((i) => {
            const n = Number(i.v);
            const h = Number.isNaN(n) ? 20 : Math.max(8, (n / max) * 100);
            return <div key={i.id} className="flex-1 rounded-t" style={{ height: `${h}%`, background: accent }} />;
          })}
        </div>
      </div>
    );
  }
  if (type === 'states') {
    return (
      <div className="space-y-3 p-4 text-center">
        {label}
        <div className="rounded-xl bg-slate-800/70 py-5 font-mono text-base font-bold" style={{ color: accent }}>
          {list[0] ? String(list[0].v) : '—'}
        </div>
        {loading && <div className="mx-auto h-6 w-6 animate-spin rounded-full border-2 border-slate-600 border-t-cyan-300" />}
        <div className="space-y-2 text-left">{list.slice(1).map(card)}</div>
      </div>
    );
  }
  if (type === 'feed') {
    return (
      <div className="space-y-3 p-4">
        {inputs.map((i) => field(i.label, i.value))}
        {label}
        <div className="space-y-2">{list.map(card)}</div>
        {loading && <div className="text-center text-[10px] text-slate-400">Loading more…</div>}
      </div>
    );
  }
  if (type === 'grid') {
    const cells = Array.from({ length: 6 }, (_, k) => history[history.length - 6 + k]);
    const firstEmpty = cells.findIndex((c) => !c);
    return (
      <div className="space-y-3 p-4">
        {label}
        <div className="grid grid-cols-3 gap-2">
          {cells.map((c, k) => (
            <div key={k}
              className={`flex aspect-square items-center justify-center rounded-lg font-mono text-[10px] font-bold text-slate-950 ${!c && loading && k === firstEmpty ? 'animate-pulse bg-slate-600' : !c ? 'bg-slate-800' : ''}`}
              style={c ? { background: accent } : undefined}>
              {c ? String(c.v) : ''}
            </div>
          ))}
        </div>
      </div>
    );
  }
  // default: list
  return (
    <div className="space-y-3 p-4">
      {inputs.map((i) => field(i.label, i.value))}
      {label}
      <div className="space-y-2">
        {list.map(card)}
        {list.length === 0 && <div className="text-xs text-slate-600">nothing yet</div>}
      </div>
    </div>
  );
}

/* ---------- Phone mockup: the Android screen this stream would drive ---------- */
function PhoneScreen({ demo, events, res, now }) {
  const screen = demo.scene;
  const inputTracks = demo.tracks.length
    ? demo.tracks.map((tr, i) => ({ id: tr.id, label: screen.inputs[i] || tr.label }))
    : [{ id: screen.inputTrack || 'a', label: screen.inputs[0] }];
  const inputs = inputTracks.map((tr) => ({ label: tr.label, value: lastVal(events, tr.id, now) }));
  const rows = demo.kind === 'flows' ? (res.sf.rows[res.sf.rows.length - 1] || { items: [] }).items : (res.out || []);
  const visible = rows.filter((i) => i.t <= now);
  const history = visible.slice(-8);            // oldest first
  const list = visible.slice(-4).reverse();     // newest first
  const counts = {};
  if (res.st) events.forEach((e) => { const s = res.st[e.id]; if (s && e.t <= now) counts[s] = (counts[s] || 0) + 1; });
  const alert = [...rows].reverse().find((i) => i.t <= now && /Error|Timeout|fallback|retry/i.test(String(i.v)));
  const loading = (res.bars || []).some((b) => b.start <= now && now < (b.cancelAt ?? b.end));
  const accent = screen.accent;
  return (
    <div className="w-[260px] shrink-0 self-center rounded-[2.2rem] border-[7px] border-slate-700 bg-slate-950 p-2 shadow-2xl lg:self-start">

/* ---------- Glossary ---------- */
const GLOSSARY = [
  { term: 'emit', def: 'Send one value out of a flow. Inside flow { }, emit(x) hands x to the collector right now.', example: 'flow { emit(1); emit(2) }   // collector receives 1, then 2' },
  { term: 'collect', def: 'Start listening to a flow and run your code for each value. Nothing happens until someone collects.', example: 'myFlow.collect { value -> println(value) }' },
  { term: 'collector', def: 'The code that receives the values (the lambda in collect). Each collector gets its own run of a cold flow.' },
  { term: 'omit (no such word in Flow)', def: 'Flow has no “omit” function. The words you probably need: filter (keep only values that pass a test), drop(n) (skip the first n values), takeWhile (stop at the first value that fails).', example: 'flow.filter { it > 0 }\nflow.drop(2)\nflow.takeWhile { it < 10 }' },
  { term: 'Flow', def: 'A stream of values produced over time, one after another. Flow<Int> means “a stream of Int values”.' },
  { term: 'cold flow', def: 'Does nothing until collected, and runs again for every collector. Example: flow { }, a Room query, a Retrofit call wrapped in a flow.' },
  { term: 'hot flow', def: 'Already running. Collectors only receive what happens while they listen. Examples: StateFlow, SharedFlow.' },
  { term: 'operator', def: 'A function that changes a flow: map, filter, debounce, combine and so on. It returns a new flow.' },
  { term: 'upstream / downstream', def: 'Upstream is everything before an operator (where values come from). Downstream is everything after it (where values go).' },
  { term: 'suspend', def: 'A function that can pause without blocking its thread, marked with the suspend keyword. Flow code runs inside suspend functions.' },
  { term: 'coroutine', def: 'A lightweight task that can pause and resume without blocking its thread. Like a cook who starts the water boiling, then chops vegetables while it heats, and comes back when it is ready. Flows are collected inside coroutines, and a suspend function is the part that is allowed to pause.', example: 'viewModelScope.launch {\n    val orders = api.fetchOrders()   // pauses here, the thread is free meanwhile\n    _ui.value = orders               // resumes here when the reply arrives\n}' },
  { term: 'dispatcher', def: 'Which thread a coroutine runs on: Dispatchers.Main (UI), Dispatchers.IO (disk and network), Dispatchers.Default (heavy CPU work).' },
  { term: 'scope', def: 'The lifetime of coroutines. viewModelScope is cancelled when the ViewModel is cleared, so its work stops too.' },
  { term: 'cancellation', def: 'Stopping work early. When the collector leaves, the flow stops emitting and its cleanup code (onCompletion, awaitClose) runs.' },
  { term: 'backpressure', def: 'When the collector is slow, the producer waits (suspends) instead of sending values faster than they can be handled.' },
  { term: 'StateFlow', def: 'A hot flow that always holds one current value. A new collector gets the latest value straight away. Equal values are ignored.' },
  { term: 'SharedFlow', def: 'A hot flow for events. With replay = 0 it has no memory: a collector only receives values sent while it is listening.' },
  { term: 'stateIn / shareIn', def: 'Turn a cold flow into a hot one (StateFlow or SharedFlow) that is shared between collectors, so the work runs once.' },
  { term: 'SharingStarted', def: 'Decides when shared work starts and stops. WhileSubscribed(5000) keeps it alive for 5 s after the last collector leaves.' },
  { term: 'replay', def: 'Giving a new collector values from the past. StateFlow replays its current value; SharedFlow replays only as many values as you set.' },
  { term: 'channel', def: 'A queue between a sender and a receiver. send() suspends when the queue is full. receive() suspends when it is empty.', example: 'val c = Channel<Int>(capacity = 2)' },
  { term: 'conflate', def: 'Keep only the newest value while the collector is busy. The older ones are dropped.' },
  { term: 'buffer', def: 'Keep every value in a queue so the producer can run ahead. Nothing is dropped.' },
  { term: 'debounce / sample', def: 'debounce waits for a pause in the values and emits the last one. sample takes the latest value every fixed time interval.' },
  { term: 'completion', def: 'The flow ends (no more values). onCompletion runs at the end, whether it succeeded, failed or was cancelled.' },
  { term: 'exception', def: 'An error thrown inside a flow. catch handles it upstream; without catch or retry, the flow ends with the error.' },
  { term: 'retry', def: 'Run the upstream again after an error. retry(2) allows two extra attempts.' },
  { term: 'launch / launchIn', def: 'launch starts a new coroutine. launchIn(scope) starts collecting a flow inside that scope.' },
  { term: 'marble diagram', def: 'The timeline drawing used on this site: each circle is a value, the horizontal line is time, and ✕ means cancelled, blocked or an error.' },
];

function Glossary() {
  const [q, setQ] = useState('');
  const items = GLOSSARY.filter((g) => (g.term + ' ' + g.def).toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="mx-auto max-w-3xl space-y-6">
      <header>
        <div className="font-mono text-[11px] uppercase tracking-widest text-purple-300">Reference</div>
        <h1 className="mt-1 font-mono text-2xl font-bold text-white sm:text-3xl">Glossary</h1>
        <p className="mt-1 text-slate-400">Words that often confuse people learning Flow, in plain language.</p>
      </header>
      <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search a word…"
        className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-400" />
      <div className="space-y-3">
        {items.map((g) => (
          <div key={g.term} className="rounded-xl border border-slate-800 bg-slate-900/70 p-4">
            <div className="font-mono text-base font-semibold text-white">{g.term}</div>
            <p className="mt-1 text-sm leading-relaxed text-slate-300">{g.def}</p>
            {g.example && <pre className="mt-2 overflow-x-auto rounded-lg bg-slate-950 p-3 font-mono text-[12px] leading-relaxed text-slate-200">{g.example}</pre>}
          </div>
        ))}
        {items.length === 0 && <p className="text-sm text-slate-500">No match. Try another word.</p>}
      </div>
    </div>
  );
}

/* ---------- Cheat sheet: which operator, which layer ---------- */
const CHEAT_LAYERS = [
  ['UI (Activity / Compose)', 'Show state and send user actions. Collect state here, never call the network.'],
  ['ViewModel', 'Hold screen state (StateFlow), combine inputs, search and retry logic, one-time events.'],
  ['Repository', 'Decide where data comes from. Convert models, handle network errors, add timeouts and retries.'],
  ['Data source', 'Room DAO, DataStore, Retrofit, sensors, listeners. Return Flow here when you can.'],
];
const CHEAT_QUESTIONS = [
  ['Wrap a callback or listener as a Flow', 'callbackFlow', 'Data source'],
  ['Several coroutines send into one flow', 'channelFlow', 'Data source'],
  ['Build a flow from code (one producer)', 'flow { emit() }', 'Repository'],
  ['Change each value', 'map (and mapNotNull to drop nulls)', 'Repository or ViewModel'],
  ['Keep only some values', 'filter, drop(n), takeWhile', 'ViewModel'],
  ['Skip repeated values', 'distinctUntilChanged', 'ViewModel'],
  ['Combine two inputs, using the latest of each', 'combine', 'ViewModel'],
  ['Combine, but decide what to emit', 'combineTransform', 'ViewModel'],
  ['Pair values one-to-one', 'zip', 'ViewModel'],
  ['Merge several sources, no pairing', 'merge', 'ViewModel'],
  ['Wait for the user to stop typing', 'debounce', 'ViewModel'],
  ['Only the newest search result matters', 'flatMapLatest (or transformLatest)', 'ViewModel'],
  ['Run requests one at a time, in order', 'flatMapConcat', 'Repository or ViewModel'],
  ['Run up to N requests at once', 'flatMapMerge(concurrency = N)', 'Repository'],
  ['Running total (starts with a value)', 'runningFold (or scan)', 'ViewModel'],
  ['Take only the first N', 'take(N)', 'ViewModel'],
  ['Show loading first', 'onStart { emit(Loading) }', 'ViewModel'],
  ['Fallback value when it fails', 'catch { emit(...) }', 'Repository'],
  ['Retry, with growing delays', 'retryWhen { … delay(…) }', 'Repository'],
  ['Retry a fixed number of times', 'retry(n)', 'Repository'],
  ['Give up after a time limit', 'withTimeoutOrNull / timeout', 'Repository'],
  ['Cleanup when the flow ends', 'onCompletion', 'Repository or use case'],
  ['Move slow work off the main thread', 'flowOn(Dispatchers.IO)', 'Repository'],
  ['Share one upstream between screens', 'shareIn', 'Repository'],
  ['Expose screen state that survives rotation', 'stateIn(…, WhileSubscribed(5000))', 'ViewModel'],
  ['One-time event (snackbar, navigation)', 'SharedFlow, or Channel and send()', 'ViewModel'],
  ['Bounded queue between producer and consumer', 'Channel(capacity)', 'ViewModel or data source'],
  ['Settings that persist', 'DataStore (Flow)', 'Data source'],
  ['Database that updates the screen', 'Room DAO returning Flow', 'Data source'],
  ['Long list loaded page by page', 'Pager (PagingData)', 'ViewModel'],
  ['Show a Flow in Compose', 'collectAsStateWithLifecycle', 'UI'],
  ['Turn a suspend call into Compose State', 'produceState', 'UI'],
  ['Long effect that must use the newest value', 'rememberUpdatedState', 'UI'],
  ['Avoid recomposing on every change', 'derivedStateOf', 'UI'],
  ['Old code: observable holder', 'LiveData (legacy)', 'ViewModel'],
  ['Old code: reactive streams', 'RxJava (subscribeOn / observeOn)', 'Repository'],
  ['Test a Flow', 'Turbine (awaitItem)', 'Tests'],
];
const CHEAT_PAIRS = [
  ['StateFlow vs SharedFlow', 'StateFlow is “what the screen shows now” (it replays the latest value). SharedFlow is “something happened once” (no replay by default).'],
  ['emit vs send', 'emit() is used inside flow { }. send() is used inside channelFlow or on a Channel.'],
  ['debounce vs sample vs conflate', 'debounce waits for silence. sample takes the latest value every N ms. conflate keeps only the newest value while the collector is busy.'],
  ['flatMapLatest vs flatMapConcat vs flatMapMerge', 'Latest cancels the old one. Concat queues in order. Merge runs in parallel.'],
  ['stateIn vs shareIn', 'stateIn gives a StateFlow (always has a value). shareIn gives a SharedFlow (events, optional replay).'],
  ['retry vs retryWhen', 'retry(n) repeats immediately. retryWhen lets you wait (backoff) and decide based on the error.'],
  ['flowOn vs collectLatest', 'flowOn moves the work above it to another thread. collectLatest cancels the previous block when a new value arrives.'],
  ['“omit” (not a Flow word)', 'Use filter (keep matching), drop(n) (skip the first n) or takeWhile (stop at the first failure).'],
];

// Example code shown when hovering (or tapping) a row in section 2. Keys match the "Use" column.
const CHEAT_CODE = {
  'callbackFlow': 'callbackFlow {\n    val listener = Listener { trySend(it) }\n    register(listener)\n    awaitClose { unregister(listener) }   // runs when the collector cancels\n}',
  'channelFlow': 'channelFlow {\n    launch { sourceA.collect { send(it) } }\n    launch { sourceB.collect { send(it) } }\n}',
  'flow { emit() }': 'flow {\n    emit(api.load())\n}',
  'map (and mapNotNull to drop nulls)': 'flow.map { it.toDomain() }\nflow.mapNotNull { it.value }   // skips nulls',
  'filter, drop(n), takeWhile': 'flow.filter { it.length >= 4 }\nflow.drop(2)              // skip the first 2\nflow.takeWhile { it < 10 } // stop at the first failure',
  'distinctUntilChanged': 'flow.distinctUntilChanged()   // skips a value equal to the previous one',
  'combine': 'combine(name, password) { n, p ->\n    n.isNotBlank() && p.length >= 8\n}',
  'combineTransform': 'combineTransform(a, b) { x, y ->\n    if (x + y >= 10) emit(x + y)   // emit only when the rule passes\n}',
  'zip': 'photos.zip(thumbs) { photo, thumb -> photo to thumb }',
  'merge': 'merge(localChanges, pushEvents)',
  'debounce': 'query.debounce(300)   // emit after 300 ms of silence',
  'flatMapLatest (or transformLatest)': 'queries.flatMapLatest { q ->\n    flow { emit(api.search(q)) }   // old search is cancelled\n}',
  'flatMapConcat': 'edits.flatMapConcat { edit ->\n    flow { emit(api.save(edit)) }   // one at a time, in order\n}',
  'flatMapMerge(concurrency = N)': 'ids.flatMapMerge(concurrency = 2) { id ->\n    flow { emit(api.fetch(id)) }\n}',
  'runningFold (or scan)': 'deposits.runningFold(0) { sum, amount -> sum + amount }',
  'take(N)': 'results.take(3)   // complete after 3 values',
  'onStart { emit(Loading) }': 'flow.onStart { emit(UiState.Loading) }',
  'catch { emit(...) }': 'flow.catch { e -> emit(cachedItems) }',
  'retryWhen { … delay(…) }': 'flow.retryWhen { cause, attempt ->\n    delay(1000L shl attempt.toInt())   // 1 s, 2 s, 4 s...\n    attempt < 3\n}',
  'retry(n)': 'flow.retry(2) { it is IOException }',
  'withTimeoutOrNull / timeout': 'withTimeoutOrNull(1500) { api.load() }   // null after 1.5 s',
  'onCompletion': 'flow.onCompletion { file.close() }   // success, error, or cancel',
  'flowOn(Dispatchers.IO)': 'flow.flowOn(Dispatchers.IO)   // everything above runs on IO',
  'shareIn': 'flow.shareIn(scope, SharingStarted.WhileSubscribed(5000), replay = 1)',
  'stateIn(…, WhileSubscribed(5000))': 'flow.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), initial)',
  'SharedFlow, or Channel and send()': 'private val _events = MutableSharedFlow<Event>()\nval events = _events.asSharedFlow()\n_events.emit(Event.Saved)',
  'Channel(capacity)': 'val jobs = Channel<Job>(capacity = 2)\njobs.send(job)     // suspends when full',
  'DataStore (Flow)': 'dataStore.data.map { prefs -> prefs[DARK_MODE] ?: false }',
  'Room DAO returning Flow': '@Query("SELECT * FROM users")\nfun observeUsers(): Flow<List<User>>',
  'Pager (PagingData)': 'Pager(PagingConfig(pageSize = 20)) { dao.pagingSource() }.flow',
  'collectAsStateWithLifecycle': 'val state by vm.state.collectAsStateWithLifecycle()',
  'produceState': 'val name by produceState("Loading…", userId) { value = repo.name(userId) }',
  'rememberUpdatedState': 'val latest by rememberUpdatedState(onDone)',
  'derivedStateOf': 'val showTop by remember { derivedStateOf { index > 8 } }',
  'LiveData (legacy)': 'val user: LiveData<User> = _user',
  'RxJava (subscribeOn / observeOn)': 'api.load()\n    .subscribeOn(Schedulers.io())\n    .observeOn(AndroidSchedulers.mainThread())\n    .subscribe { render(it) }',
  'Turbine (awaitItem)': 'vm.state.test {\n    assertEquals(UiState.Loading, awaitItem())\n    cancelAndIgnoreRemainingEvents()\n}',
};

function CheatSheet() {
  const [open, setOpen] = useState('');
  const [q, setQ] = useState('');
  const term = q.trim().toLowerCase();
  const hit = (...xs) => !term || xs.join(' ').toLowerCase().includes(term);
  const layers = CHEAT_LAYERS.filter((r) => hit(...r));
  const questions = CHEAT_QUESTIONS.filter((r) => hit(...r));
  const pairs = CHEAT_PAIRS.filter((r) => hit(...r));
  return (
    <div className="mx-auto max-w-4xl space-y-8">
      <header>
        <div className="font-mono text-[11px] uppercase tracking-widest text-purple-300">Reference</div>
        <h1 className="mt-1 font-mono text-2xl font-bold text-white sm:text-3xl">Cheat sheet</h1>
        <p className="mt-1 text-slate-400">Find your question, see which operator to use and which layer it belongs in.</p>
      </header>
      <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search, e.g. “retry”, “screen state”, “Compose”…"
        className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-400" />

      {layers.length > 0 && (
        <section className="space-y-3">
          <h2 className="text-xs font-semibold uppercase tracking-wider text-cyan-300">1 · Which layer?</h2>
          <div className="grid gap-3 sm:grid-cols-2">
            {layers.map(([name, use]) => (
              <div key={name} className="rounded-xl border border-slate-800 bg-slate-900/70 p-4">
                <div className="font-semibold text-white">{name}</div>
                <p className="mt-1 text-sm text-slate-300">{use}</p>
              </div>
            ))}
          </div>
        </section>
      )}

      {questions.length > 0 && (
        <section className="space-y-3">
          <h2 className="text-xs font-semibold uppercase tracking-wider text-cyan-300">2 · I want to… <span className="ml-2 normal-case tracking-normal text-slate-500">hover or tap a row for example code</span></h2>
          <div className="overflow-x-auto rounded-xl border border-slate-800">
            <table className="w-full text-left text-sm">
              <thead className="bg-slate-900 text-xs uppercase tracking-wider text-slate-400">
                <tr><th className="px-4 py-2">Question</th><th className="px-4 py-2">Use</th><th className="px-4 py-2">Layer</th></tr>
              </thead>
              <tbody>
                {questions.map(([question, use, layer]) => (
                  <React.Fragment key={question}>
                    <tr onMouseEnter={() => setOpen(use)} onMouseLeave={() => setOpen('')} onClick={() => setOpen(use)}
                      className={`cursor-pointer border-t border-slate-800 align-top transition ${open === use ? 'bg-purple-500/10' : 'hover:bg-slate-900/60'}`}>
                      <td className="px-4 py-2 text-slate-300">{question}</td>
                      <td className="px-4 py-2 font-mono text-[13px] text-purple-200">{use}</td>
                      <td className="px-4 py-2 text-slate-400">{layer}</td>
                    </tr>
                    {open === use && CHEAT_CODE[use] && (
                      <tr className="bg-slate-950">
                        <td colSpan={3} className="px-4 pb-3">
                          <pre className="overflow-x-auto rounded-lg bg-slate-900 p-3 font-mono text-[12px] leading-relaxed text-slate-200">{CHEAT_CODE[use]}</pre>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      )}

      {pairs.length > 0 && (
        <section className="space-y-3">
          <h2 className="text-xs font-semibold uppercase tracking-wider text-cyan-300">3 · Things people mix up</h2>
          <div className="space-y-3">
            {pairs.map(([name, text]) => (
              <div key={name} className="rounded-xl border border-slate-800 bg-slate-900/70 p-4">
                <div className="font-mono text-sm font-semibold text-white">{name}</div>
                <p className="mt-1 text-sm leading-relaxed text-slate-300">{text}</p>
              </div>
            ))}
          </div>
        </section>
      )}

      {layers.length + questions.length + pairs.length === 0 && <p className="text-sm text-slate-500">No match. Try another word.</p>}
    </div>
  );
}

/* ---------- Local progress & preferences (saved in this browser only) ---------- */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode: ignore */ }
  },
};

/* ---------- App shell ---------- */
function App() {
  const idFromHash = () => {
    const h = (location.hash || '').replace('#/', '');
    return h === 'glossary' || h === 'cheatsheet' || DEMOS.some((d) => d.id === h) ? h : DEMOS[0].id;
  };
  const [activeId, setActiveId] = useState(idFromHash);
  const [filter, setFilter] = useState('');
  const [navOpen, setNavOpen] = useState(false);
  const [seen, setSeen] = useState(() => store.get('reactive-seen', []));
  const [light, setLight] = useState(() => store.get('reactive-theme', 'dark') === 'light');
  const demo = DEMOS.find((d) => d.id === activeId);

  const go = (id) => {
    setActiveId(id);
    if (location.hash !== '#/' + id) location.hash = '#/' + id;
    setNavOpen(false);
    window.scrollTo(0, 0);
  };

  // Deep links: #/debounce opens that lesson; the browser back button works too.
  useEffect(() => {
    const onHash = () => setActiveId(idFromHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // Progress: remember every lesson the learner has opened.
  useEffect(() => {
    if (activeId !== 'glossary' && activeId !== 'cheatsheet' && !seen.includes(activeId)) {
      const next = [...seen, activeId];
      setSeen(next);
      store.set('reactive-seen', next);
    }
  }, [activeId]);

  // Light / dark theme.
  useEffect(() => {
    document.documentElement.classList.toggle('light', light);
    store.set('reactive-theme', light ? 'light' : 'dark');
  }, [light]);

  // Keyboard: arrows move between lessons, Space plays or pauses the animation.
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      const ids = DEMOS.map((d) => d.id);
      const i = ids.indexOf(activeId);
      if (e.key === 'ArrowDown' && i >= 0 && i < ids.length - 1) { e.preventDefault(); go(ids[i + 1]); }
      else if (e.key === 'ArrowUp' && i > 0) { e.preventDefault(); go(ids[i - 1]); }
      else if (e.key === ' ' && tag !== 'BUTTON' && activeId !== 'glossary') { e.preventDefault(); window.dispatchEvent(new Event('reactive-toggle')); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [activeId]);

  const q = filter.trim().toLowerCase();
  const matches = (d) => !q || (d.title + ' ' + d.sub + ' ' + (d.simple || '') + ' ' + (d.useCase || '')).toLowerCase().includes(q);
  const viewed = seen.filter((id) => DEMOS.some((d) => d.id === id)).length;

  return (
    <div className="min-h-screen md:flex">
      <button onClick={() => setNavOpen((o) => !o)}
        className="flex w-full items-center gap-2 border-b border-slate-800 bg-slate-900 px-4 py-3 text-sm text-slate-200 md:hidden">
        <Icon name="layers" size={16} />{navOpen ? 'Hide lessons' : 'Browse lessons'}
      </button>
      <aside className={`${navOpen ? 'block' : 'hidden'} border-b border-slate-800 bg-slate-900/80 md:sticky md:top-0 md:block md:h-screen md:w-72 md:shrink-0 md:overflow-y-auto md:border-b-0 md:border-r`}>
        <div className="flex items-center gap-3 px-5 py-4">
          <div className="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-purple-500 via-fuchsia-400 to-orange-400 text-slate-950">
            <Icon name="zap" size={18} />
          </div>
          <div>
            <div className="text-sm font-bold text-white">Reactive Encyclopedia</div>
            <div className="text-[11px] text-slate-500">Flow · StateFlow · SharedFlow · AppState</div>
          </div>
        </div>
        <div className="space-y-2 px-5 pb-3">
          <input value={filter} onChange={(e) => setFilter(e.target.value)} placeholder="Search lessons…"
            className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-1.5 text-sm text-slate-100 outline-none focus:border-cyan-400" />
          <div className="flex items-center justify-between text-[11px] text-slate-500">
            <span>{viewed} / {DEMOS.length} viewed · {Object.values(store.get('reactive-quiz', {})).filter(Boolean).length} quiz right</span>
            <button onClick={() => setLight((l) => !l)} className="rounded-md border border-slate-700 px-2 py-0.5 hover:border-cyan-400">
              {light ? 'Dark' : 'Light'} theme
            </button>
          </div>
          <div className="text-[10px] text-slate-600">↑ ↓ move between lessons · Space play / pause</div>
        </div>
        <nav className="pb-4">
          <button onClick={() => go('glossary')}
            className={`flex w-full items-center gap-3 px-5 py-2.5 text-left text-sm font-semibold transition ${activeId === 'glossary' ? 'bg-purple-500/15 text-white shadow-[inset_3px_0_0_#a78bfa]' : 'text-purple-300 hover:bg-slate-800/60'}`}>
            <Icon name="book" size={15} />
            <span>Glossary</span>
          </button>
          <button onClick={() => go('cheatsheet')}
            className={`flex w-full items-center gap-3 px-5 py-2.5 text-left text-sm font-semibold transition ${activeId === 'cheatsheet' ? 'bg-purple-500/15 text-white shadow-[inset_3px_0_0_#a78bfa]' : 'text-purple-300 hover:bg-slate-800/60'}`}>
            <Icon name="check" size={15} />
            <span>Cheat sheet</span>
          </button>
          {CATS.map((cat, ci) => {
            const items = DEMOS.filter((d) => d.cat === cat && matches(d));
            if (!items.length) return null;
            return (
              <div key={cat}>
                <div className="px-5 pb-1 pt-4 text-[10px] font-semibold uppercase tracking-widest text-slate-500">{ci + 1} · {cat}</div>
                {items.map((d) => (
                  <button key={d.id} onClick={() => go(d.id)}
                    className={`flex w-full items-center gap-3 px-5 py-2 text-left text-sm transition ${activeId === d.id ? 'bg-purple-500/15 text-white shadow-[inset_3px_0_0_#a78bfa]' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-100'}`}>
                    <Icon name={d.icon} size={15} />
                    <span className="truncate font-mono text-[13px]">{d.title}</span>
                    {seen.includes(d.id) && <Icon name="check" size={12} className="ml-auto shrink-0 text-emerald-400" />}
                  </button>
                ))}
              </div>
            );
          })}
        </nav>
      </aside>
      <main className="min-w-0 flex-1 p-4 sm:p-6 lg:p-8">
        {activeId === 'glossary' ? <Glossary /> : activeId === 'cheatsheet' ? <CheatSheet /> : <DemoView key={activeId} demo={demo} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
