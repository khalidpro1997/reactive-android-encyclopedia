function Icon({ name, size = 16, className = '' }) {
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      className={className} dangerouslySetInnerHTML={{ __html: ICONS[name] || '' }} />
  );
}

/* ---------- pure stream operators (events are recomputed from the log) ---------- */
const sorted = (evs) => [...evs].sort((p, q) => p.t - q.t || p.seq - q.seq);
const lastVal = (evs, track, now) => {
  const xs = sorted(evs.filter((e) => e.track === track && e.t <= now));
  return xs.length ? xs[xs.length - 1].v : undefined;
};

// combine / transform: re-run whenever EITHER side emits, using the latest of the other
const pairLatest = (f) => (evs) => {
  let la = null, lb = null;
  const out = [], lines = [];
  sorted(evs).forEach((e) => {
    if (e.track === 'a') la = e; else lb = e;
    if (la && lb) {
      const other = e.track === 'a' ? lb : la;
      out.push({ id: 'o' + e.id, t: e.t, v: f(la.v, lb.v) });
      lines.push({ from: { t: other.t, r: other.track }, to: { t: e.t, r: 'out' } });
    }
  });
  return { out, lines };
};

// zip: 1st with 1st, 2nd with 2nd (waits for both)
const zipOp = (evs) => {
  const qa = [], qb = [], out = [], lines = [];
  sorted(evs).forEach((e) => {
    (e.track === 'a' ? qa : qb).push(e);
    while (qa.length && qb.length) {
      const x = qa.shift(), y = qb.shift();
      out.push({ id: 'z' + x.id + y.id, t: e.t, v: `${x.v}|${y.v}` });
      lines.push({ from: { t: x.t, r: 'a' }, to: { t: e.t, r: 'out' } });
      lines.push({ from: { t: y.t, r: 'b' }, to: { t: e.t, r: 'out' } });
    }
  });
  return { out, lines };
};

/* ---------- StateFlow vs SharedFlow model ---------- */
function flowsCompute(evs, now) {
  const S = sorted(evs);
  const em = S.filter((e) => e.track === 'a');

  // subscription sessions: the Activity collector (stops/starts) + late listeners
  const sessions = [{ id: 'act0', name: 'Activity collector', t0: 0, t1: Infinity }];
  let cur = sessions[0];
  S.filter((e) => e.track === 'stop' || e.track === 'start').forEach((e) => {
    if (e.track === 'stop' && cur) { cur.t1 = e.t; cur = null; }
    else if (e.track === 'start' && !cur) {
      cur = { id: 'act' + e.id, name: 'Activity (restarted)', t0: e.t, t1: Infinity };
      sessions.push(cur);
    }
  });
  S.filter((e) => e.track === 'sub').forEach((e, i) =>
    sessions.push({ id: 'late' + e.id, name: `Late listener #${i + 1}`, t0: e.t, t1: Infinity }));
  const visible = sessions.filter((s) => s.t0 <= now);
  const anyActive = (t) => sessions.some((s) => s.t0 <= t && t < s.t1);

  const lifecycle = {
    label: 'lifecycle', color: '#94a3b8',
    items: S.filter((e) => ['stop', 'start', 'sub'].includes(e.track))
      .map((e) => ({ id: 'l' + e.id, t: e.t, v: e.track === 'stop' ? 'onStop' : e.track === 'start' ? 'onStart' : 'collect' })),
  };

  // StateFlow: distinct state; the current value is replayed to every new collector
  let last; const passes = []; const sfSt = {};
  em.forEach((e) => {
    if (e.v === last) sfSt[e.id] = 'ignored';
    else { last = e.v; passes.push(e); }
  });
  const stateAt = (t) => { let v; passes.forEach((p) => { if (p.t <= t) v = p.v; }); return v; };

  const sfRows = [
    lifecycle,
    { label: 'emit()', color: OUT, items: em.map((e) => ({ id: 'e' + e.id, t: e.t, v: e.v, status: sfSt[e.id] })) },
  ];
  visible.forEach((s) => {
    const items = [];
    const rv = stateAt(s.t0);
    if (rv !== undefined) items.push({ id: 'r' + s.id, t: s.t0, v: rv, color: REPLAY });
    passes.forEach((p) => { if (p.t > s.t0 && p.t < s.t1) items.push({ id: 's' + s.id + p.id, t: p.t, v: p.v }); });
    sfRows.push({ label: s.name, color: GOOD, items });
  });

  // SharedFlow: no replay, every emission goes only to live collectors
  const shSt = {};
  em.forEach((e) => { if (!anyActive(e.t)) shSt[e.id] = 'lost'; });
  const shRows = [
    lifecycle,
    { label: 'emit()', color: OUT, items: em.map((e) => ({ id: 'e' + e.id, t: e.t, v: e.v, status: shSt[e.id] })) },
  ];
  visible.forEach((s) => {
    shRows.push({
      label: s.name, color: GOOD,
      items: em.filter((e) => e.t > s.t0 && e.t < s.t1).map((e) => ({ id: 's' + s.id + e.id, t: e.t, v: e.v })),
    });
  });
  return { sf: { rows: sfRows }, sh: { rows: shRows } };
}

/* ---------- Demo catalogue ---------- */
const PAIR_SCRIPT = [

];
const PAIR_BUTTONS = [

  { label: 'Emit B', track: 'b', v: '#' },

const TWO_TRACKS = [{ id: 'a', label: 'Track A' }, { id: 'b', label: 'Track B' }];

const DEMOS = [
  /* ---- 1. Combining & Merging ---- */
  {

    tracks: TWO_TRACKS, outLabel: 'combine()', script: PAIR_SCRIPT, buttons: PAIR_BUTTONS,
    compute: pairLatest((a, b) => `${a}|${b}`),
    useCase: 'Login form validation: enable the Sign In button only when the username AND the password are both valid, whichever field the user touched last.',
    code: `val username = MutableStateFlow("")
val password = MutableStateFlow("")

// Re-evaluated whenever EITHER field changes, using the latest value of the other
val isLoginEnabled: StateFlow<Boolean> =

        user.length >= 3 && pass.length >= 8
    }.stateIn(viewModelScope, SharingStarted.Eagerly, false)`,
    xml: 'Classic equivalent: two TextWatcher callbacks that each set a boolean flag and call updateButton(), or a MediatorLiveData with two addSource() calls. Combine replaces the flags and the bookkeeping.',
  },

    id: 'zip', cat: CATS[0], icon: 'link', title: 'zip',
    sub: 'Waits for a brand-new value on BOTH tracks, then pairs them 1-to-1 in order.',
    explain: 'zip is a queue join. A value on one track waits in its queue until the other track produces its matching item. Notice Track A “1” waiting until Track B catches up.',
    tracks: TWO_TRACKS, outLabel: 'zip()', script: PAIR_SCRIPT, buttons: PAIR_BUTTONS,
    compute: zipOp,
    useCase: 'Upload pipeline: pair each picked photo with its server-generated thumbnail before rendering the card.',
    code: `val photos: Flow<Photo> = photoPicker.selections()
val thumbs: Flow<Thumbnail> = thumbnailApi.generate()

// 1st photo with 1st thumbnail, 2nd with 2nd, and so on
val uploads: Flow<Pair<Photo, Thumbnail>> =
    photos.zip(thumbs) { photo, thumb -> photo to thumb }`,
    xml: 'Classic equivalent: two Retrofit callbacks that append to lists, plus a counter that renders only when both lists have the same index filled. zip gives you the join for free.',
  },

    compute: (evs) => ({ out: sorted(evs).map((e) => ({ id: 'o' + e.id, t: e.t, v: e.v, color: TC[e.track] })) }),
    useCase: 'Sync screen: one collector handles database changes, websocket pushes and pull-to-refresh events as they happen.',
    code: `val localChanges: Flow<Event> = dao.observeChanges().map { Event.Local(it) }
val remoteSync: Flow<Event> = socket.incomingEvents().map { Event.Remote(it) }
val refreshes: Flow<Event> = refreshRequests.map { Event.Refresh }

// One pipeline handles every source as events happen
merge(localChanges, remoteSync, refreshes)
    .onEach { event -> _ui.value = reduce(_ui.value, event) }
    .launchIn(viewModelScope)`,
    xml: 'Classic equivalent: registering the same handler on a ContentObserver, a BroadcastReceiver and a SwipeRefreshLayout listener, all funnelling into one update method.',
  },
  {
    id: 'transform', cat: CATS[0], icon: 'calculator', title: 'AppState transform { }',
    sub: 'Two reactive state boxes. The formula re-runs automatically, with no manual subscriptions.',
    explain: 'The formula block reads price and qty, so both are tracked automatically. Change either box and total recomputes. Note: I could not confirm a Jetpack “AppState.transform” API, so the snippet uses Compose’s derivedStateOf, which implements the same idea.',
    tracks: [{ id: 'a', label: 'price' }, { id: 'b', label: 'qty' }], outLabel: 'total', panel: 'appstate',
    script: [
      { t: 400, track: 'a', v: 10 }, { t: 1000, track: 'b', v: 2 }, { t: 2300, track: 'b', v: 3 },
      { t: 3400, track: 'a', v: 12 }, { t: 4600, track: 'a', v: 8 },
    ],

      { label: 'price +2', track: 'a', add: 2 },

    ],
    compute: pairLatest((p, q) => p * q),
    useCase: 'Cart total: the price × quantity label updates the moment either value changes, with no manual listeners to add or remove.',
    code: `class CartViewModel : ViewModel() {
    var price by mutableStateOf(10)

    xml: 'Classic equivalent: MediatorLiveData with addSource(price) { recalc() } and addSource(qty) { recalc() }, plus remembering to keep those sources consistent. The auto-tracked block removes that bookkeeping.',
  },

  /* ---- 2. Transforming & Filtering ---- */
  {
    id: 'map', cat: CATS[1], icon: 'shuffle', title: 'map',
    sub: 'Transforms each marble’s value (and here, its shape) as it passes through.',
    explain: 'Each input marble becomes exactly one output marble. Here the transform multiplies by 10 and the output changes from a circle into a square.',
    tracks: [{ id: 'a', label: 'Int' }], outLabel: 'map { it * 10 }', outColor: OUT,
    script: [{ t: 400, track: 'a', v: 3 }, { t: 1300, track: 'a', v: 7 }, { t: 2100, track: 'a', v: 1 }, { t: 2900, track: 'a', v: 5 }],
    buttons: [{ label: 'Emit next int', track: 'a', v: '#' }],
    compute: (evs) => ({
      out: sorted(evs).filter((e) => e.track === 'a').map((e) => ({ id: 'o' + e.id, t: e.t, v: e.v * 10, shape: 'square' })),
    }),

    code: `val rawCents: Flow<Int> = priceUpdates

// Each value is transformed as it flows through; the collector only sees dollars
val prices: Flow<Double> = rawCents.map { cents -> cents / 100.0 }`,
    xml: 'Classic equivalent: Transformations.map(liveData) { }, or formatting inside onBindViewHolder() for every row.',
  },
  {
    id: 'filter', cat: CATS[1], icon: 'filter', title: 'filter',
    sub: 'Blocks marbles that fail a condition and lets valid ones pass.',
    explain: 'The predicate is { it.length >= 4 }. Failing values are stopped at the filter and never reach the output row.',
    tracks: [{ id: 'a', label: 'String' }], outLabel: 'filter', outColor: OUT,
    script: [{ t: 400, track: 'a', v: 'api' }, { t: 1200, track: 'a', v: 'kotlin' }, { t: 2000, track: 'a', v: 'x' }, { t: 2900, track: 'a', v: 'flow' }, { t: 3800, track: 'a', v: 'ok' }],
    buttons: [
      { label: "Emit 'kt'", track: 'a', v: 'kt' },
      { label: "Emit 'coroutines'", track: 'a', v: 'coroutines' },

  {
    id: 'distinct', cat: CATS[1], icon: 'equal', title: 'distinctUntilChanged',
    sub: 'Blocks consecutive duplicates. Only passes a value when it actually differs from the previous one.',
    explain: 'Duplicates are ignored only when they repeat the last value that was let through. A → A is blocked; A → B passes.',
    tracks: [{ id: 'a', label: 'State' }], outLabel: 'distinct', outColor: OUT,
    script: [{ t: 400, track: 'a', v: 'A' }, { t: 1100, track: 'a', v: 'A' }, { t: 1900, track: 'a', v: 'B' }, { t: 2600, track: 'a', v: 'B' }, { t: 3300, track: 'a', v: 'A' }],
    buttons: [
      { label: 'Emit A', track: 'a', v: 'A' },
      { label: 'Emit B', track: 'a', v: 'B' },
      { label: 'Emit Duplicate', track: 'a', v: '=' },
    ],
    compute: (evs) => {

        bars.push({ id: 'b' + e.id, start, end, label: `GET ${e.v}`, color: OUT });
        out.push({ id: 'o' + e.id, t: end, v: `${e.v} ✓` });
      });
      return { out, bars };
    },
    useCase: 'Loading thumbnails for a grid: fetch several at once, but never more than 2 at a time to save bandwidth.',
    code: `val results: Flow<Item> = itemIds
    .flatMapMerge(concurrency = 2) { id ->      // at most 2 inner flows run at once
        flow { emit(api.fetchItem(id)) }
    }`,
    xml: 'Classic equivalent: a fixed-size thread pool (Executors.newFixedThreadPool(2)) or a Semaphore(2) around your Retrofit calls.',
    quiz: {
      q: 'flatMapMerge(concurrency = 2) gets a third request while two are running. What happens?',
      options: ['It cancels the oldest running request', 'It waits in a queue until a slot frees up', 'It is dropped'],
      answer: 1,
      why: 'Extra requests wait for a free slot. Nothing is cancelled. flatMapLatest is the operator that cancels.',
    },
  },
  {
    id: 'buffer', cat: CATS[6], icon: 'inbox', title: 'buffer()',
    sub: 'Lets the producer run ahead. Values wait in a queue, so none are lost.',
    explain: 'The consumer takes 900 ms per item. buffer keeps every value, and the grey “waiting” bars show how long each one queued. Compare with conflate, which drops everything except the latest.',
    tracks: [{ id: 'a', label: 'Producer' }], outLabel: 'consumer (900ms)', outColor: OUT,
    script: Array.from({ length: 12 }, (_, i) => ({ t: 300 + i * 250, track: 'a', v: i + 1 })),
    buttons: [{ label: 'Burst ×6', track: 'a', v: '#', n: 6, gap: 150 }],
    compute: (evs) => {
      const S = sorted(evs).filter((e) => e.track === 'a');
      let free = 0;
      const out = [], bars = [];
      S.forEach((e) => {
        const start = Math.max(e.t, free);
        free = start + 900;
        out.push({ id: 'o' + e.id, t: start, v: e.v });
        if (start > e.t) bars.push({ id: 'w' + e.id, start: e.t, end: start, label: 'waiting', color: '#64748b' });
      });
      return { out, bars };
    },
    useCase: 'Saving analytics events: a slow save should delay events, never lose them.',
    code: `sensorReadings
    .buffer(capacity = 64)              // producer keeps running; up to 64 values wait
    .collect { reading -> slowUi.draw(reading) }`,
    xml: 'Classic equivalent: a BlockingQueue or ConcurrentLinkedQueue drained by a background thread (or HandlerThread).',
    quiz: {
      q: 'What is the main difference between buffer() and conflate()?',
      options: ['buffer drops old values; conflate keeps them all', 'buffer keeps every value in a queue; conflate keeps only the newest', 'They are identical'],
      answer: 1,
      why: 'buffer delivers every value, in order. conflate skips the intermediate ones so the collector always gets the latest.',
    },
  },
  {
    id: 'sharein', cat: CATS[6], icon: 'share', title: 'shareIn()',
    sub: 'One upstream request, shared by every collector. A late collector gets the latest value straight away.',
    explain: 'Left: every screen starts its own request (cold). Right: shareIn starts one upstream when the first screen arrives, and replay = 1 gives each new screen the latest value. The upstream here ticks every 900 ms. Count the requests.',
    heads: ['Cold: every screen starts its own request', 'shareIn: one shared upstream (replay = 1)'],
    kind: 'flows', tracks: [], outLabel: '',
    script: [{ t: 400, track: 'sub', v: 'A' }, { t: 2600, track: 'sub', v: 'B' }],
    buttons: [
      { label: 'Screen C joins', track: 'sub', v: 'C' },
      { label: 'Screen A joins again', track: 'sub', v: 'A' },
    ],
    compute: (evs, now) => {
      const TICK = 900;
      const cols = sorted(evs).filter((e) => e.track === 'sub')
        .map((e) => ({ id: e.id, name: `Screen ${e.v}`, t0: e.t }))
        .filter((c) => c.t0 <= now);
      const start = cols.length ? cols[0].t0 : Infinity;
      const ticksFrom = (s) => {
        const out = [];
        for (let k = 1; s + k * TICK <= now; k++) out.push({ k, t: s + k * TICK });
        return out;
      };
      const cold = [{ label: `requests started: ${cols.length}`, color: '#94a3b8', items: [] }];
      cols.forEach((c) => cold.push({
        label: `${c.name} · own`, color: GOOD,
        items: [{ id: 'req' + c.id, t: c.t0, v: 'request', color: '#94a3b8' },
          ...ticksFrom(c.t0).map(({ k, t }) => ({ id: c.id + 'k' + k, t, v: `#${k}` }))],
      }));
      const shared = [{ label: 'upstream (1 request)', color: OUT, items: ticksFrom(start).map(({ k, t }) => ({ id: 'u' + k, t, v: `#${k}` })) }];
      cols.forEach((c) => {
        const items = [];
        const k0 = Math.floor((c.t0 - start) / TICK);
        if (k0 >= 1) items.push({ id: 'rp' + c.id, t: c.t0, v: `#${k0}`, color: REPLAY });
        ticksFrom(start).filter(({ t }) => t > c.t0).forEach(({ k, t }) => items.push({ id: c.id + 's' + k, t, v: `#${k}` }));
        shared.push({ label: c.name, color: GOOD, items });
      });
      return { sf: { rows: cold }, sh: { rows: shared } };
    },
    useCase: 'Shared data flow for several screens (for example the user profile on the home and settings screens): one network call, not one per screen.',
    code: `val userFlow: SharedFlow<User> = api.observeUser()
    .shareIn(
        scope = viewModelScope,
        started = SharingStarted.WhileSubscribed(5000),
        replay = 1                      // late collectors get the latest User straight away
    )`,
    xml: 'Classic equivalent: a singleton repository holding a LiveData/Callback and a manual "is request in flight" flag, so screens do not each fire their own call.',
    quiz: {
      q: 'What does shareIn(replay = 1) give you compared with a normal Flow?',
      options: ['A new upstream request for every collector', 'One upstream shared by all collectors, with the latest value replayed to new ones', 'A cache that never updates'],
      answer: 1,
      why: 'shareIn turns a cold flow into a hot one: a single upstream is shared, and replay controls how many past values late collectors receive.',
    },
  },
];

/* ---------- Timeline rendering ---------- */
function buildRows(demo, events, res) {
  const rows = demo.tracks.map((tr) => ({
    label: tr.label, color: TC[tr.id],
    items: events.filter((e) => e.track === tr.id).map((e) => ({ id: e.id, t: e.t, v: e.v, status: res.st ? res.st[e.id] : undefined })),
  }));
  rows.push({ label: demo.outLabel, color: demo.outColor, items: res.out || [], bars: res.bars || [] });
  return rows;
}

function Marble({ it, color, left, top, now }) {
  const dim = it.status && it.status !== 'pass';
  const badge = { blocked: '✕', dropped: '✕', cancelled: '✕', ignored: '=', lost: '∅' }[it.status];
  const recent = now - it.t < 400;
  const strike = it.status === 'cancelled' || it.status === 'dropped';
  return (
    <div className={`marble absolute flex h-7 min-w-[32px] max-w-[96px] -translate-x-1/2 -translate-y-1/2 items-center justify-center truncate px-2.5 font-mono text-[11px] font-bold text-slate-950 ${it.shape === 'square' ? 'rounded-md' : 'rounded-full'} ${recent ? 'pulse' : ''}`}
      style={{
        left: `${left}%`, top, background: color,
        boxShadow: dim ? 'none' : `0 0 14px ${color}aa`,
        opacity: dim ? 0.28 : 1,
        filter: dim ? 'grayscale(1)' : undefined,
        textDecoration: strike ? 'line-through' : undefined,
        color: undefined,
      }}>
      {String(it.v)}
      {badge && (
        <span className="absolute -right-2 -top-2 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] text-white">{badge}</span>
      )}
    </div>
  );
}

function Bar({ b, now, xp, top }) {
  if (b.start > now) return null;
  const stop = b.cancelAt !== undefined ? b.cancelAt : b.end;
  const span = b.end - b.start;
  const progress = Math.max(0, Math.min(1, (Math.min(now, stop) - b.start) / span));
  const cancelled = b.cancelAt !== undefined && now >= b.cancelAt;
  const done = !cancelled && now >= b.end;
  const color = cancelled ? '#f87171' : done ? GOOD : b.color || OUT;
  return (
    <div className="absolute flex h-5 -translate-y-1/2 items-center overflow-hidden rounded-md border"
      style={{ left: `${xp(b.start)}%`, width: `${xp(b.end) - xp(b.start)}%`, top, borderColor: color + '99', background: '#1e293b' }}>
      <div className="stripes absolute inset-y-0 left-0" style={{ width: `${progress * 100}%`, background: color + '55' }} />
      <span className="relative z-10 truncate px-2 font-mono text-[10px] text-white" style={{ textDecoration: cancelled ? 'line-through' : undefined }}>
        {b.label}
      </span>
      {cancelled && <span className="absolute right-1 z-10 text-[10px] font-bold text-red-400">✕ cancelled</span>}
    </div>
  );
}

function Timeline({ rows, lines = [], now }) {
  const viewStart = Math.max(0, now - 6800);
  const xp = (t) => ((t - viewStart) / WINDOW_MS) * 100;
  const cy = (i) => i * ROW_H + ROW_H / 2;
  const rowIdx = (r) => (r === 'out' ? rows.length - 1 : r === 'a' ? 0 : 1);
  const inView = (t) => t >= viewStart && t <= now;
  return (
    <div className="rounded-xl border border-slate-800 bg-slate-950/70 p-3">
      <div className="flex">
        <div className="w-28 shrink-0 sm:w-40">
          {rows.map((r, i) => (
            <div key={i} style={{ height: ROW_H }} className="flex items-center gap-2 pr-2 font-mono text-[11px] text-slate-400">
              <span className="h-2 w-2 shrink-0 rounded-full" style={{ background: r.color }} />
              <span className="truncate">{r.label}</span>
            </div>
          ))}
        </div>
        <div className="relative min-w-0 flex-1 overflow-hidden" style={{ height: rows.length * ROW_H }}>
          {rows.map((_, i) => (
            <div key={i} className="absolute inset-x-0 border-t border-slate-700/70" style={{ top: cy(i) }} />
          ))}
          <svg className="pointer-events-none absolute inset-0 h-full w-full overflow-visible">
            {lines.filter((l) => inView(l.to.t) && l.from.t >= viewStart).map((l, k) => (
              <line key={k}
                x1={`${xp(l.from.t)}%`} y1={cy(rowIdx(l.from.r))}
                x2={`${xp(l.to.t)}%`} y2={cy(rowIdx(l.to.r))}
                stroke="#c4b5fd" strokeOpacity="0.6" strokeWidth="1.5" strokeDasharray="4 4" />
            ))}
          </svg>
          <div className="absolute inset-y-0 w-px bg-cyan-300/50" style={{ left: `${xp(now)}%` }} />
          {rows.flatMap((r, i) => (r.bars || []).map((b) => (
            <Bar key={i + '-' + b.id} b={b} now={now} xp={xp} top={cy(i)} />
          )))}
          {rows.flatMap((r, i) => (r.items || []).filter((it) => inView(it.t)).map((it) => (
            <Marble key={i + '-' + it.id} it={it} color={it.color || r.color} left={xp(it.t)} top={cy(i)} now={now} />
          )))}
        </div>
      </div>
    </div>
  );
}

function Legend() {
  return (
    <p className="text-[11px] leading-relaxed text-slate-500">
      <span className="text-slate-300">●</span> emission &nbsp;·&nbsp;
      <span className="text-red-400">✕</span> blocked / cancelled / dropped &nbsp;·&nbsp;
      <span className="text-slate-300">=</span> duplicate ignored &nbsp;·&nbsp;
      <span className="text-slate-300">∅</span> lost (no collector) &nbsp;·&nbsp;
      dashed lines = source → output &nbsp;·&nbsp; cyan line = now
    </p>
  );
}

/* ---------- Demo page ---------- */
function DemoView({ demo }) {
  const [now, setNow] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [speed, setSpeed] = useState(1);
  const [manual, setManual] = useState([]);
  const [copied, setCopied] = useState(false);
  const seq = useRef(0);

  const scriptEv = useMemo(() => demo.script.map((e, i) => ({ ...e, id: 's' + i, seq: i })), [demo]);
  const events = useMemo(() => [...scriptEv, ...manual], [scriptEv, manual]);
  const res = demo.compute(events, now);

  // virtual clock: advances with requestAnimationFrame, scaled by speed
  useEffect(() => {
    if (!playing) return;
    let raf, last = null;
    const frame = (ts) => {
      if (last !== null) {
        const dt = Math.min(ts - last, 1000); // track wall-clock time; cap only huge gaps (tab hidden)
        setNow((n) => n + dt * speed);
      }
      last = ts;
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, [playing, speed]);

  // Pause once everything has scrolled out of view, so the final state stays on screen.
  const lastEventT = Math.max(0, ...scriptEv.map((e) => e.t), ...manual.map((e) => e.t));
  useEffect(() => {
    if (playing && now > lastEventT + WINDOW_MS - 1500) setPlaying(false);
  }, [now, playing, lastEventT]);

  // Adds events at the current virtual time. '#' = next integer, '=' = repeat last, add = last + add.
  const addEvents = (track, v, n = 1, gap = 0, add) => {
    setManual((prev) => {
      const pool = [...scriptEv, ...prev];
      const out = [...prev];
      for (let i = 0; i < n; i++) {
        const onTrack = sorted(pool.filter((e) => e.track === track));
        const last = onTrack.length ? onTrack[onTrack.length - 1] : null;
        let value = v;
        if (add !== undefined) value = (last ? last.v : 0) + add;
        else if (v === '#') value = onTrack.length + 1;
        else if (v === '=') { if (!last) continue; value = last.v; }
        seq.current += 1;
        const ev = { id: 'm' + seq.current, seq: 1000 + seq.current, t: now + i * gap, track, v: value };
        pool.push(ev);
        out.push(ev);
      }
      return out;
    });
  };

  const reset = () => { setNow(0); setManual([]); setPlaying(true); };

  const copy = async () => {
    try { await navigator.clipboard.writeText(demo.code); setCopied(true); }
    catch (e) { setCopied(false); }
    setTimeout(() => setCopied(false), 1400);
  };

  const btn = 'inline-flex items-center gap-1.5 rounded-lg border border-slate-700 bg-slate-800/70 px-3 py-1.5 text-sm text-slate-100 transition hover:border-purple-400 hover:bg-slate-800 active:scale-95';

  return (
    <div className="mx-auto max-w-5xl space-y-6">
      <header>
        <div className="font-mono text-[11px] uppercase tracking-widest text-purple-300">{demo.cat}</div>
        <h1 className="mt-1 font-mono text-2xl font-bold text-white sm:text-3xl">{demo.title}</h1>
        <p className="mt-1 text-slate-400">{demo.sub}</p>
        <p className="mt-3 text-sm leading-relaxed text-slate-300">{demo.explain}</p>
      </header>

      {/* transport */}
      <section className="flex flex-wrap items-center gap-2">
        <button className={btn} onClick={() => setPlaying((p) => !p)}>
          <Icon name={playing ? 'pause' : 'play'} size={14} />{playing ? 'Pause' : 'Play'}
        </button>
        <div className="inline-flex overflow-hidden rounded-lg border border-slate-700">
          {[0.5, 1].map((s) => (
            <button key={s} onClick={() => setSpeed(s)}
              className={`px-3 py-1.5 text-sm font-mono transition ${speed === s ? 'bg-purple-500/30 text-white' : 'bg-slate-800/70 text-slate-400 hover:text-slate-100'}`}>
              {s}x
            </button>
          ))}
        </div>
        <button className={btn} onClick={reset}><Icon name="rotate" size={14} />Reset Track</button>
        <span className="ml-auto font-mono text-xs text-slate-500">t = {(now / 1000).toFixed(1)}s</span>
      </section>

      {/* animation + Android screen */}
      <section className="flex flex-col gap-6 lg:flex-row lg:items-start">
        <div className="min-w-0 flex-1">
        {demo.kind === 'flows' ? (
          <div className="space-y-5">
            <div>
              <div className="mb-2 text-sm font-semibold text-slate-200">{demo.heads ? demo.heads[0] : <>StateFlow <span className="font-normal text-slate-500">— sticky state, replays to new collectors, ignores duplicates</span></>}</div>
              <Timeline rows={res.sf.rows} now={now} />
            </div>
            <div>
              <div className="mb-2 text-sm font-semibold text-slate-200">{demo.heads ? demo.heads[1] : <>SharedFlow <span className="font-normal text-slate-500">— one-shot events, replay = 0, nothing kept for nobody</span></>}</div>
              <Timeline rows={res.sh.rows} now={now} />
            </div>
            <Legend />
          </div>
        ) : (
          <div className="space-y-2">
            <Timeline rows={buildRows(demo, events, res)} lines={res.lines || []} now={now} />
            <Legend />
          </div>
        )}
        </div>
        <PhoneScreen demo={demo} events={events} res={res} now={now} />
      </section>

      {demo.panel === 'appstate' && <AppStatePanel events={events} now={now} />}

      {/* hands-on triggers */}
      <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
        <div className="mb-3 text-xs font-semibold uppercase tracking-wider text-purple-300">Hands-on triggers</div>
        <div className="flex flex-wrap items-center gap-2">
          {(demo.buttons || []).map((b) => (
            <button key={b.label} className={btn} onClick={() => addEvents(b.track, b.v, b.n, b.gap, b.add)}>{b.label}</button>
          ))}
          {demo.textbox && (
            <input
              className="min-w-[16rem] flex-1 rounded-lg border border-slate-700 bg-slate-950 px-3 py-1.5 font-mono text-sm text-slate-100 placeholder-slate-500 outline-none focus:border-cyan-400"
              placeholder="Search Query — type fast, then pause"
              value={lastVal(events, 'a', now) ?? ''}
              onChange={(e) => addEvents('a', e.target.value)} />
          )}
        </div>
      </section>

      {/* Android developer context */}
      <section className="grid gap-4 lg:grid-cols-3">
        <div className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4 lg:col-span-2">
          <div className="mb-3 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-purple-300">
              <Icon name="code" size={14} />ViewModel (Kotlin)
            </div>
            <button onClick={copy} className="inline-flex items-center gap-1.5 rounded-md border border-slate-700 px-2 py-1 text-xs text-slate-300 hover:border-cyan-400">
              <Icon name={copied ? 'check' : 'copy'} size={12} />{copied ? 'Copied' : 'Copy'}
            </button>
          </div>
          <pre className="overflow-x-auto rounded-lg bg-slate-950 p-4 font-mono text-[12px] leading-relaxed text-slate-200">{demo.code}</pre>
        </div>
        <div className="space-y-4">
          <div className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
            <div className="mb-2 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-purple-300">
              <Icon name="smartphone" size={14} />Real-world use case
            </div>
            <p className="text-sm leading-relaxed text-slate-300">{demo.useCase}</p>
          </div>
          <div className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
            <div className="mb-2 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-orange-300">
              <Icon name="book" size={14} />XML / Classic equivalent
            </div>
            <p className="text-sm leading-relaxed text-slate-300">{demo.xml}</p>
          </div>
        </div>
      </section>

      {demo.quiz && <Quiz key={demo.id} quiz={demo.quiz} />}
    </div>
  );
}

        </div>
        <div className="h-1 w-full overflow-hidden bg-slate-800">
          {loading && <div className="h-full w-1/2 animate-pulse" style={{ background: accent }} />}
        </div>
        <div className="space-y-2 p-4">
          {inputs.map((i) => (
            <div key={i.label}>
              <div className="text-[10px] uppercase tracking-wider text-slate-500">{i.label}</div>
              <div className="mt-1 truncate rounded-lg border border-slate-700 bg-slate-950 px-3 py-1.5 font-mono text-sm text-white">
                {i.value === undefined ? '—' : String(i.value)}
              </div>
            </div>
          ))}
        </div>
        <div className="px-4 text-[10px] uppercase tracking-wider text-slate-500">{screen.listLabel}</div>
        <div className="mt-1 space-y-2 px-4">
          {list.map((i) => (
            <div key={i.id} className="flex items-center justify-between rounded-lg bg-slate-800/70 px-3 py-1.5 text-xs text-slate-200">
              <span className="truncate font-mono">{String(i.v)}</span>
              <span className="text-[10px]" style={{ color: i.color || accent }}>●</span>
            </div>
          ))}
          {list.length === 0 && <div className="text-xs text-slate-600">nothing yet</div>}
        </div>
        <div className="mt-auto flex flex-wrap gap-1 px-4 pb-2">
          {Object.entries(counts).map(([k, v]) => (
            <span key={k} className="rounded-full bg-slate-800 px-2 py-0.5 text-[10px] text-slate-300">{v} {k}</span>
          ))}
        </div>
        {alert && (
          <div className="mx-3 mb-3 rounded-lg bg-red-500/90 px-3 py-2 text-xs font-medium text-white">Snackbar · {String(alert.v)}</div>
        )}
      </div>
    </div>
  );
}

/* ---------- Quick check quiz ---------- */
function Quiz({ quiz }) {
  const [pick, setPick] = useState(null);
  const ok = pick === quiz.answer;
  return (
    <div className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
      <div className="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-emerald-300">
        <Icon name="check" size={14} />Quick check
      </div>
      <p className="mb-3 text-sm text-slate-200">{quiz.q}</p>
      <div className="flex flex-col gap-2">
        {quiz.options.map((o, i) => (
          <button key={i} onClick={() => setPick(i)}
            className={`rounded-lg border px-3 py-2 text-left text-sm transition ${pick === null ? 'border-slate-700 hover:border-cyan-400' : i === quiz.answer ? 'border-emerald-400 bg-emerald-400/10' : pick === i ? 'border-red-400 bg-red-400/10' : 'border-slate-800 opacity-60'}`}>
            {o}
          </button>
        ))}
      </div>
      {pick !== null && (
        <p className={`mt-3 text-sm ${ok ? 'text-emerald-300' : 'text-amber-300'}`}>{ok ? 'Correct. ' : 'Not quite. '}{quiz.why}</p>
      )}
    </div>
  );
}

/* ---------- App shell ---------- */
function App() {
  const [activeId, setActiveId] = useState(DEMOS[0].id);
  const demo = DEMOS.find((d) => d.id === activeId);
  return (
    <div className="min-h-screen md:flex">
      <aside className="border-b border-slate-800 bg-slate-900/80 md:sticky md:top-0 md:h-screen md:w-72 md:shrink-0 md:overflow-y-auto md:border-b-0 md:border-r">
        <div className="flex items-center gap-3 px-5 py-4">
          <div className="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-purple-500 via-fuchsia-400 to-orange-400 text-slate-950">
            <Icon name="zap" size={18} />
          </div>
          <div>
            <div className="text-sm font-bold text-white">Reactive Encyclopedia</div>
            <div className="text-[11px] text-slate-500">Flow · StateFlow · SharedFlow · AppState</div>
          </div>
        </div>
        <nav className="pb-4">
          {CATS.map((cat, ci) => (
            <div key={cat}>
              <div className="px-5 pb-1 pt-4 text-[10px] font-semibold uppercase tracking-widest text-slate-500">{ci + 1} · {cat}</div>
              {DEMOS.filter((d) => d.cat === cat).map((d) => (
                <button key={d.id} onClick={() => setActiveId(d.id)}
                  className={`flex w-full items-center gap-3 px-5 py-2 text-left text-sm transition ${activeId === d.id ? 'bg-purple-500/15 text-white shadow-[inset_3px_0_0_#a78bfa]' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-100'}`}>
                  <Icon name={d.icon} size={15} />
                  <span className="truncate font-mono text-[13px]">{d.title}</span>
                </button>
              ))}
            </div>
          ))}
        </nav>
      </aside>
      <main className="min-w-0 flex-1 p-4 sm:p-6 lg:p-8">
        <DemoView key={activeId} demo={demo} />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
